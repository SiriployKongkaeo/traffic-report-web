    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // Supabase Configuration & Initialization
        const SUPABASE_URL = "https://chtpyzwidibfwihnbgws.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable__CPYpK87sGqkLx1jsf3c1w_I9cI3O8L";
        
        let supabaseClient = null;
        try {
            if (window.supabase && SUPABASE_URL && SUPABASE_URL.startsWith('http')) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.warn("Supabase init error:", e);
        }
        window.sbClient = supabaseClient;

        // จัดการ Device ID ประจำเครื่องเพื่อความปลอดภัยในการลบข้อมูล
        function getDeviceUUID() {
            let uuid = localStorage.getItem('traffic_device_uuid');
            if (!uuid) {
                uuid = 'device_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now();
                localStorage.setItem('traffic_device_uuid', uuid);
            }
            return uuid;
        }

        // จัดการชื่อผู้ใช้งาน (ห้ามซ้ำ / จำชื่อไว้ใน LocalStorage)
        function getStoredUsername() {
            let name = localStorage.getItem('traffic_reporter_name');
            if (!name) {
                name = 'ผู้ใช้_' + Math.floor(1000 + Math.random() * 9000);
                localStorage.setItem('traffic_reporter_name', name);
            }
            return name;
        }

        window.subscribeIncidents = async function() {
            let localData = [];
            try {
                const saved = localStorage.getItem('local_traffic_reports');
                if (saved) localData = JSON.parse(saved);
            } catch(e) {}

            window.userReports = localData;
            if (window.updateUserReportsFeed) window.updateUserReportsFeed();
            if (window.renderAllIncidentMarkers) window.renderAllIncidentMarkers();

            if (!window.sbClient) {
                console.warn("Supabase client URL is not configured.");
                return;
            }

            async function fetchCloudData() {
                try {
                    const { data, error } = await window.sbClient
                        .from('traffic-report-web')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (!error && data) {
                        window.userReports = data.map(item => ({
                            id: item.id,
                            userName: item.usename || item.name || 'ผู้ใช้งานทั่วไป',
                            deviceUuid: item.device_uuid || '', // ตรวจสอบรหัสเครื่องจากฐานข้อมูล
                            category: item.status || 'traffic',
                            categoryText: getCategoryText(item.status),
                            detail: item.detail || '',
                            imageUrl: item.name && item.name.startsWith('data:image') ? item.name : 'https://placehold.co/600x400/5c4a3c/fef3c7?text=Traffic+Report',
                            lat: item.lat,
                            lon: item.lot,
                            createdAt: item.created_at || new Date().toISOString(),
                            timeStr: item.created_at ? new Date(item.created_at).toLocaleString('th-TH', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''
                        }));
                        
                        try { localStorage.setItem('local_traffic_reports', JSON.stringify(window.userReports)); } catch(e){}
                        if (window.updateUserReportsFeed) window.updateUserReportsFeed();
                        if (window.renderAllIncidentMarkers) window.renderAllIncidentMarkers();
                    }
                } catch (err) {
                    console.warn("Cloud fetch error:", err);
                }
            }

            await fetchCloudData();
            setInterval(() => { fetchCloudData(); }, 5000);
        };

        function getCategoryText(catKey) {
            switch(catKey) {
                case 'traffic': return '🚦 การจราจรติดขัดหนาแน่น';
                case 'accident': return '💥 เกิดอุบัติเหตุ / ชนกัน';
                case 'road': return '🚧 ถนนชำรุด / เป็นหลุมเป็นบ่อ';
                case 'flood': return '🌊 น้ำท่วมขังรอการระบาย';
                case 'construction': return '🏗️ มีการซ่อมแซมทาง / ก่อสร้าง';
                default: return '🚦 ' + (catKey || 'เหตุการณ์บนถนน');
            }
        }
    </script>

    <script>
        let map;
        let selectedImageBase64 = null;
        let searchSuggestTimer = null;
        let searchRequestSeq = 0;
        
        window.userReports = [];
        let activeMarkers = [];
        let currentLocationMarker = null;
        let currentSearchMarker = null;
        let myCurrentCoords = null;
        let currentFilterMode = 'all';

        const DEFAULT_LAT = 14.1617;
        const DEFAULT_LON = 101.8906;
        const DEFAULT_ZOOM = 13;

        const customLocationAliases = [
            { keywords: ['เวโรน่า', 'เวโรน่าแอททับลาน', 'verona', 'เดอะเวโรน่า', 'ทับลาน'], name: 'The Verona at Tub Lan (เวโรน่า แอท ทับลาน)', lat: 14.1617, lon: 101.8906, address: 'อ.นาดี จ.ปราจีนบุรี' },
            { keywords: ['ม.ธรรมศาสตร์', 'ธรรมศาสตร์', 'มธ.'], name: 'มหาวิทยาลัยธรรมศาสตร์ (ศูนย์รังสิต)', lat: 14.0736, lon: 100.6056, address: 'อ.คลองหลวง จ.ปทุมธานี' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const currentName = getStoredUsername();
            document.getElementById('displayUsername').innerText = currentName;
        });

        function changeUsernamePrompt() {
            const current = getStoredUsername();
            const newName = prompt("กรุณาระบุชื่อผู้รายงานของคุณ (ห้ามซ้ำกัน):", current);
            if (!newName || !newName.trim()) return;
            const trimmed = newName.trim();
            
            // ตรวจสอบกับข้อมูลในเครื่องและคลาวด์ว่ามีชื่อนี้แล้วหรือยัง
            const isDuplicate = window.userReports.some(r => r.userName.toLowerCase() === trimmed.toLowerCase() && r.userName !== current);
            if (isDuplicate) {
                alert("ชื่อผู้รายงานนี้มีผู้ใช้งานแล้วในระบบ กรุณาใช้ชื่ออื่นที่ไม่ซ้ำกัน");
                return;
            }

            localStorage.setItem('traffic_reporter_name', trimmed);
            document.getElementById('displayUsername').innerText = trimmed;
            alert("เปลี่ยนชื่อผู้รายงานเรียบร้อยแล้ว");
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('leftSidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            if (!sidebar || !backdrop) return;
            sidebar.classList.toggle('-translate-x-full');
            backdrop.classList.toggle('hidden');
        }

        function toggleMobileSidebarMobileOnly() {
            if (window.innerWidth < 768) toggleMobileSidebar();
        }

        function handleSearchInput(e) {
            const rawQuery = e.target.value.trim();
            const suggestBox = document.getElementById('searchSuggestions');
            
            if (!rawQuery || rawQuery.length < 1) {
                if (suggestBox) { suggestBox.classList.add('hidden'); suggestBox.innerHTML = ''; }
                return;
            }

            const currentSeq = ++searchRequestSeq;
            clearTimeout(searchSuggestTimer);
            
            searchSuggestTimer = setTimeout(() => {
                if (currentSeq !== searchRequestSeq || !map || !map.Search) return;

                map.Search.search(rawQuery, { limit: 10 });
                map.Event.unbind('search');
                map.Event.bind('search', res => {
                    if (currentSeq !== searchRequestSeq || !suggestBox) return;
                    let apiDataList = res && res.data ? res.data : [];
                    let combinedResults = [];

                    // แทรก Aliases
                    customLocationAliases.forEach(alias => {
                        if (alias.keywords.some(kw => rawQuery.toLowerCase().includes(kw.toLowerCase()) || kw.toLowerCase().includes(rawQuery.toLowerCase()))) {
                            combinedResults.push({ name: alias.name, address: alias.address, lat: alias.lat, lon: alias.lon, score: 100 });
                        }
                    });

                    apiDataList.forEach(item => {
                        if (!item.lat || !item.lon) return;
                        let distKm = myCurrentCoords ? calculateDistanceKm(myCurrentCoords.lat, myCurrentCoords.lon, item.lat, item.lon) : 0;
                        
                        // กรองรัศมีไม่เกิน 100 กม. เว้นแต่คำค้นหายาวหรือระบุเฉพาะเจาะจง
                        if (myCurrentCoords && rawQuery.length < 10 && distKm > 100) return;

                        combinedResults.push({
                            name: item.name || 'สถานที่',
                            address: item.address || '',
                            lat: item.lat,
                            lon: item.lon,
                            distKm: distKm,
                            score: (item.name && item.name.toLowerCase().includes(rawQuery.toLowerCase())) ? 50 : 10
                        });
                    });

                    combinedResults.sort((a, b) => b.score - a.score || (a.distKm || 0) - (b.distKm || 0));

                    if (combinedResults.length > 0) {
                        suggestBox.innerHTML = `
                            <div class="p-2 bg-[#4a3b2f] border-b border-[#6e5849] flex justify-between items-center text-[10px] text-amber-200/80">
                                <span>ผลการค้นหาใกล้คุณ (≤100 กม.)</span>
                                <button onclick="document.getElementById('searchSuggestions').classList.add('hidden')" class="hover:text-white font-bold px-1">✕ ปิด</button>
                            </div>
                        ` + combinedResults.slice(0, 6).map(item => `
                            <div onclick="selectSearchResult(${item.lat}, ${item.lon}, '${(item.name || '').replace(/'/g, "\\'")}')" class="px-4 py-2.5 hover:bg-[#5c4a3c] cursor-pointer text-xs border-b border-[#6e5849] last:border-0 transition-colors">
                                <p class="font-bold text-white flex items-center gap-1.5"><i class="fa-solid fa-location-dot text-amber-300"></i> ${item.name}</p>
                                <p class="text-[10px] text-amber-200/70 truncate pl-4">${item.address} ${item.distKm != null ? '(' + item.distKm.toFixed(1) + ' กม.)' : ''}</p>
                            </div>
                        `).join('');
                        suggestBox.classList.remove('hidden');
                    } else {
                        suggestBox.innerHTML = `<div class="px-4 py-3 text-xs text-amber-200/60 text-center">ไม่พบสถานที่ในรัศมี 100 กม. หรือพิมพ์ชื่อเฉพาะเพื่อค้นหา</div>`;
                        suggestBox.classList.remove('hidden');
                    }
                });
            }, 300);
        }

        document.addEventListener('click', function(event) {
            const searchContainer = document.getElementById('searchInput')?.closest('.relative');
            const suggestBox = document.getElementById('searchSuggestions');
            if (searchContainer && suggestBox && !searchContainer.contains(event.target)) {
                suggestBox.classList.add('hidden');
            }
        });

        function selectSearchResult(lat, lon, name) {
            document.getElementById('searchInput').value = name;
            const suggestBox = document.getElementById('searchSuggestions');
            if (suggestBox) suggestBox.classList.add('hidden');
            flyToLocation(lat, lon, 15);
            if (currentSearchMarker) map.Overlays.remove(currentSearchMarker);
            currentSearchMarker = new longdo.Marker({ lon, lat }, { title: '', detail: `<div style="padding:6px; font-weight:bold; color:#1f2937;">📍 ${name}</div>` });
            map.Overlays.add(currentSearchMarker);
        }

        function calculateDistanceKm(lat1, lon1, lat2, lon2) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return null;
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        function setDistanceFilter(mode) {
            currentFilterMode = mode;
            const buttons = { 'all': 'filterAll', 10: 'filter10', 20: 'filter20', 30: 'filter30', 100: 'filter100' };
            Object.keys(buttons).forEach(key => {
                const btn = document.getElementById(buttons[key]);
                if (!btn) return;
                if (key == mode) {
                    btn.className = "py-1 rounded-lg font-medium text-white bg-[#6e5849] transition-all text-center";
                } else {
                    btn.className = "py-1 rounded-lg font-medium text-amber-200/70 hover:text-white transition-all text-center";
                }
            });
            if (mode !== 'all' && !myCurrentCoords) getCurrentLocation();
            if (window.updateUserReportsFeed) window.updateUserReportsFeed();
        }

        function getCategoryStyle(catKey) {
            switch (catKey) {
                case 'traffic': return { icon: 'fa-traffic-light', bg: 'bg-blue-600' };
                case 'accident': return { icon: 'fa-car-burst', bg: 'bg-red-600' };
                case 'road': return { icon: 'fa-road-barrier', bg: 'bg-amber-600' };
                case 'flood': return { icon: 'fa-water', bg: 'bg-cyan-600' };
                case 'construction': return { icon: 'fa-person-digging', bg: 'bg-orange-600' };
                default: return { icon: 'fa-bullhorn', bg: 'bg-purple-600' };
            }
        }

        function handleImagePreview(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600, MAX_HEIGHT = 600;
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } }
                    else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    selectedImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('imagePreview').src = selectedImageBase64;
                    document.getElementById('imageUploadPlaceholder').classList.add('hidden');
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function removeSelectedImage(e) {
            if (e) e.stopPropagation();
            selectedImageBase64 = null;
            document.getElementById('reportImageInput').value = '';
            document.getElementById('imagePreview').src = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            document.getElementById('imageUploadPlaceholder').classList.remove('hidden');
        }

        function openReportModal() {
            const currentName = getStoredUsername();
            document.getElementById('modalReporterName').innerText = currentName;
            setCoordinatesFromMapCenter();
            document.getElementById('reportModal').classList.remove('hidden');
            document.getElementById('reportModal').classList.add('flex');
        }

        function closeReportModal() {
            removeSelectedImage();
            document.getElementById('reportModal').classList.add('hidden');
            document.getElementById('reportModal').classList.remove('flex');
        }

        function setCoordinatesFromMapCenter() {
            if (!map) return;
            const loc = map.location();
            document.getElementById('reportCoords').value = `พิกัดกึ่งกลางแผนที่ (${loc.lat.toFixed(4)}, ${loc.lon.toFixed(4)})`;
            document.getElementById('reportCoords').dataset.lat = loc.lat;
            document.getElementById('reportCoords').dataset.lon = loc.lon;
        }

        function setCoordinatesFromCurrentGPS() {
            if (!navigator.geolocation) { alert("เบราว์เซอร์ไม่รองรับ GPS"); return; }
            navigator.geolocation.getCurrentPosition(
                pos => {
                    document.getElementById('reportCoords').value = `ตำแหน่งปัจจุบัน (${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)})`;
                    document.getElementById('reportCoords').dataset.lat = pos.coords.latitude;
                    document.getElementById('reportCoords').dataset.lon = pos.coords.longitude;
                    pinCurrentLocation(pos.coords.latitude, pos.coords.longitude);
                },
                err => { alert("กรุณาเปิดสิทธิ์ GPS เพื่อระบุพิกัด"); },
                { timeout: 10000, enableHighAccuracy: true }
            );
        }

        async function submitIncidentReport(e) {
            e.preventDefault();
            if (!selectedImageBase64) { alert('กรุณาแนบรูปภาพประกอบ'); return; }

            const lat = parseFloat(document.getElementById('reportCoords').dataset.lat || DEFAULT_LAT);
            const lon = parseFloat(document.getElementById('reportCoords').dataset.lon || DEFAULT_LON);
            const reporterName = getStoredUsername();
            const deviceUuid = getDeviceUUID(); // ใช้รหัสอุปกรณ์ประจำเครื่อง
            const category = document.getElementById('reportCategory').value;
            const categoryText = document.getElementById('reportCategory').options[document.getElementById('reportCategory').selectedIndex].text;
            const detail = document.getElementById('reportDetail').value.trim() || 'ไม่มีรายละเอียด';
            const timeStr = new Date().toLocaleString('th-TH', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

            const newReportItem = {
                id: 'report-' + Date.now(),
                userName: reporterName,
                deviceUuid: deviceUuid,
                category, categoryText, detail,
                imageUrl: selectedImageBase64, lat, lon, timeStr
            };

            try {
                if (window.sbClient) {
                    await window.sbClient.from('traffic-report-web').insert([{
                        usename: reporterName,
                        device_uuid: deviceUuid, // บันทึกรหัสอุปกรณ์ลงคลาวด์
                        status: category,
                        detail: detail,
                        name: selectedImageBase64,
                        lat: lat,
                        lot: lon
                    }]);
                }
                if (!window.userReports) window.userReports = [];
                window.userReports.unshift(newReportItem);
                localStorage.setItem('local_traffic_reports', JSON.stringify(window.userReports));

                if (window.updateUserReportsFeed) window.updateUserReportsFeed();
                if (window.renderAllIncidentMarkers) window.renderAllIncidentMarkers();

                closeReportModal();
                flyToLocation(lat, lon, 14);
            } catch (err) {
                console.error(err);
            }
        }

        // ฟังก์ชันลบรายงาน ตรวจสอบจาก deviceUuid ของเครื่องเท่านั้น
        async function deleteMyReport(reportId) {
            if (!confirm("คุณต้องการลบรายงานเหตุการณ์นี้ใช่หรือไม่?")) return;
            try {
                if (window.sbClient) {
                    await window.sbClient.from('traffic-report-web').delete().eq('id', reportId);
                }
                window.userReports = window.userReports.filter(r => r.id !== reportId);
                localStorage.setItem('local_traffic_reports', JSON.stringify(window.userReports));
                if (window.updateUserReportsFeed) window.updateUserReportsFeed();
                if (window.renderAllIncidentMarkers) window.renderAllIncidentMarkers();
                alert("ลบรายงานเรียบร้อยแล้ว");
            } catch(e) {
                alert("ไม่สามารถลบรายงานได้ในขณะนี้");
            }
        }

        function reportToAdmin(reportId, userName) {
            alert(`ส่งเรื่องแจ้งธงรายงานไปยังผู้ดูแลระบบ (Admin) สำหรับโพสต์ของ "${userName}" เรียบร้อยแล้ว แอดมินจะทำการตรวจสอบและพิจารณาลบออกทางหลังบ้านครับ`);
        }

        window.renderAllIncidentMarkers = function() {
            if (!map) return;
            activeMarkers.forEach(m => map.Overlays.remove(m));
            activeMarkers = [];

            if (!window.userReports) return;
            window.userReports.forEach(report => {
                const style = getCategoryStyle(report.category);
                const pinElement = document.createElement('div');
                pinElement.className = `w-9 h-9 ${style.bg} text-white rounded-full shadow-xl border-2 border-white flex items-center justify-center transform hover:scale-110 transition-transform cursor-pointer`;
                pinElement.innerHTML = `<i class="fa-solid ${style.icon} text-sm font-bold"></i>`;

                const marker = new longdo.Marker(
                    { lon: report.lon, lat: report.lat },
                    {
                        title: '',
                        detail: `<div style="color: #1f2937; font-family: Kanit, sans-serif; font-size: 14px; padding: 6px;"><b style="color: #dc2626;">${report.categoryText}</b><br><span>โดย: ${report.userName} (${report.timeStr})</span><br><img src="${report.imageUrl}" style="width:100%; height:130px; object-fit:cover; border-radius:8px; margin:6px 0;"><div style="margin-top:4px;">${report.detail}</div></div>`,
                        icon: { html: pinElement.outerHTML, offset: { x: 18, y: 18 } },
                        weight: true
                    }
                );
                map.Overlays.add(marker);
                activeMarkers.push(marker);
            });
        };

        window.updateUserReportsFeed = function() {
            const feedContainer = document.getElementById('userReportsList');
            const badge = document.getElementById('reportCountBadge');
            const currentDeviceUuid = getDeviceUUID(); // ดึงรหัสอุปกรณ์ปัจจุบัน
            let reports = window.userReports ? [...window.userReports] : [];

            reports.forEach(item => {
                if (myCurrentCoords && item.lat && item.lon) {
                    item.distanceKm = calculateDistanceKm(myCurrentCoords.lat, myCurrentCoords.lon, item.lat, item.lon);
                } else { item.distanceKm = null; }
            });

            if (typeof currentFilterMode === 'number' && myCurrentCoords) {
                reports = reports.filter(item => item.distanceKm !== null && item.distanceKm <= currentFilterMode);
            }

            if (badge) badge.innerText = `${reports.length} เหตุการณ์`;
            if (reports.length === 0) {
                feedContainer.innerHTML = `<p class="text-xs text-amber-200/60 text-center py-8">ยังไม่มีรายงานเหตุการณ์ในเงื่อนไขนี้</p>`;
                return;
            }

            feedContainer.innerHTML = reports.map(item => {
                const distHtml = item.distanceKm !== null ? `<span class="bg-[#4a3b2f] text-amber-300 border border-[#7a6452] text-[10px] px-1.5 py-0.5 rounded">${item.distanceKm < 1 ? (item.distanceKm * 1000).toFixed(0) + ' ม.' : item.distanceKm.toFixed(1) + ' กม.'}</span>` : '';
                
                // ตรวจสอบสิทธิ์ความเป็นเจ้าของจาก deviceUuid หรือสำรองด้วยชื่อกรณีข้อมูลเก่าไม่มีฟิลด์รหัสเครื่อง
                const isMyReport = item.deviceUuid ? (item.deviceUuid === currentDeviceUuid) : (item.userName.toLowerCase() === getStoredUsername().toLowerCase());
                
                const actionButtonHtml = isMyReport 
                    ? `<button onclick="event.stopPropagation(); deleteMyReport('${item.id}')" class="bg-red-900/60 hover:bg-red-800 text-red-200 border border-red-700/50 text-[10px] px-2 py-1 rounded flex items-center gap-1"><i class="fa-solid fa-trash-can"></i> ลบของฉัน</button>`
                    : `<button onclick="event.stopPropagation(); reportToAdmin('${item.id}', '${item.userName}')" class="bg-amber-900/40 hover:bg-amber-900 text-amber-200 border border-amber-700/50 text-[10px] px-2 py-1 rounded flex items-center gap-1"><i class="fa-solid fa-flag"></i> แจ้งแอดมิน</button>`;

                return `
                    <div onclick="flyToLocation(${item.lat}, ${item.lon}, 15); toggleMobileSidebarMobileOnly();" class="p-3 bg-[#4a3b2f] hover:bg-[#5c4a3c] border border-[#6e5849] rounded-xl shadow-sm text-xs cursor-pointer transition-all">
                        <div class="flex items-center justify-between mb-1.5">
                            <span class="font-bold text-white">${item.categoryText}</span>
                            <div class="flex items-center gap-1">${distHtml}<span class="text-[10px] text-amber-200/70">${item.timeStr || ''}</span></div>
                        </div>
                        ${item.imageUrl ? `<img src="${item.imageUrl}" class="w-full h-28 object-cover rounded-lg mb-2 border border-[#6e5849]">` : ''}
                        <p class="text-amber-100 text-xs line-clamp-2 mb-2">${item.detail}</p>
                        <div class="flex items-center justify-between text-[10px] text-amber-200/70 border-t border-[#6e5849] pt-1.5">
                            <span>โดย: <b class="text-white">${item.userName}</b></span>
                            ${actionButtonHtml}
                        </div>
                    </div>
                `;
            }).join('');
        };

        function flyToLocation(lat, lon, zoom = 12) {
            if (!map) return;
            map.location({ lon, lat }, true);
            map.zoom(zoom, true);
        }

        function resetToDefaultCenter() { flyToLocation(DEFAULT_LON, DEFAULT_LAT, DEFAULT_ZOOM); }

        function pinCurrentLocation(lat, lon) {
            if (!map) return;
            myCurrentCoords = { lat, lon };
            if (currentLocationMarker) map.Overlays.remove(currentLocationMarker);
            currentLocationMarker = new longdo.Marker({ lon, lat }, {
                title: "", detail: "<div style='padding:4px; font-weight:bold; color:#1f2937;'>📍 ตำแหน่งปัจจุบันของคุณ</div>", weight: true
            });
            map.Overlays.add(currentLocationMarker);
            flyToLocation(lat, lon, 14);
            if (window.updateUserReportsFeed) window.updateUserReportsFeed();
        }

        function getCurrentLocation() {
            if (!navigator.geolocation) { alert("เบราว์เซอร์ไม่รองรับ GPS"); return; }
            navigator.geolocation.getCurrentPosition(
                pos => { pinCurrentLocation(pos.coords.latitude, pos.coords.longitude); },
                err => { alert("กรุณาเปิดสิทธิ์ GPS เพื่อระบุพิกัด"); },
                { timeout: 10000, enableHighAccuracy: true }
            );
        }

        function searchLocation() {
            const rawQuery = document.getElementById('searchInput').value.trim();
            if (!rawQuery || !map) return;
            map.Search.search(rawQuery);
            map.Event.unbind('search');
            map.Event.bind('search', res => {
                if (res && res.data && res.data.length > 0) {
                    const match = res.data[0];
                    if (match.lat && match.lon) selectSearchResult(match.lat, match.lon, match.name || rawQuery);
                } else {
                    alert("ไม่พบสถานที่ที่ค้นหา");
                }
            });
        }

        function handleSearchKeyPress(e) { if (e.key === 'Enter') searchLocation(); }

        window.onload = function() {
            map = new longdo.Map({ placeholder: document.getElementById('map') });
            map.location({ lon: DEFAULT_LON, lat: DEFAULT_LAT }, true);
            map.zoom(DEFAULT_ZOOM, true);
            map.Layers.add(longdo.Layers.TRAFFIC);
            if (window.subscribeIncidents) window.subscribeIncidents();
        };
    </script>
